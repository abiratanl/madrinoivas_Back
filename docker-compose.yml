services:
  # Database Service
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      # Em produção: não expor (remover esta linha)
      # Em dev: expor para localhost
      - '${DB_BIND_HOST:-127.0.0.1}:${DB_PORT_EXTERNAL:-3307}:3306'
    volumes:
      - db_data:/var/lib/mysql
      - './init.sql:/docker-entrypoint-initdb.d/init.sql'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  api:
    build: .
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}'
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    env_file:
      - .env
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:


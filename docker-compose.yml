services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # SEM ports: aqui (produção por padrão)
    volumes:
      - db_data:/var/lib/mysql
      - './init.sql:/docker-entrypoint-initdb.d/init.sql'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}'
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    env_file:
      - .env
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # Serviço auxiliar APENAS para desenvolvimento
  db-dev-ports:
    image: alpine/socat
    command: 'tcp-listen:${DB_PORT_EXTERNAL:-3306},fork,reuseaddr tcp-connect:db:3306'
    ports:
      - '${DB_BIND_HOST:-127.0.0.1}:${DB_PORT_EXTERNAL:-3306}:3306'
    depends_on:
      - db
    profiles:
      - dev

volumes:
  db_data:
